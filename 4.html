<!DOCTYPE html>
<html>
<head>
<title>Registration</title>
<style>
body{font-family:Arial;background:#eee}
table{margin:auto;background:#fff;padding:10px}
input[type="text"], input[type="email"], input[type="password"], select, textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 16px;
}
input[type="radio"], input[type="checkbox"] {margin-right: 5px;}
td{padding:5px}
textarea{padding: 20px;}
input[type="submit"]:hover {background-color: #45a049;}
.error {color: #ff0000;font-size: 14px;}
input[type=reset]{background-color:rgb(255, 0, 0);}
input[type="submit"],input[type="reset"] {
    background-color: #4CAF50;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 18px;
}
</style>
</head>
<body>
<h1 style="text-align:center">Registration Form</h1>
<form>
<table>
<tr><td>Name:</td><td><input type=text required></td></tr>
<tr><td>Email:</td><td><input type=email required></td></tr>
<tr><td>Password:</td><td><input type=password required></td></tr>
<tr><td>Confirm:</td><td><input type=password required></td></tr>
<tr><td>Gender:</td><td><input type=radio name=g>Male<input type=radio name=g>Female</td></tr>
<tr><td>DOB:</td><td><input type=date required></td></tr>
<tr><td>Country:</td><td><select><option>India</option><option>UK</option></select></td></tr>
<tr><td>Interests:</td><td><input type=checkbox>Sports <input type=checkbox>Music</td></tr>
<tr><td>Bio:</td><td><textarea></textarea></td></tr>
<tr><td colspan=2 align=center><input type="submit" value = "register"> <input type=reset value="reset"></td></tr>
</table>
</form>
</body>
</html>
